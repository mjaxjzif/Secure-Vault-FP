```
<div class="logo">🔐</div>

<h1>Reset Password</h1>

<p class="subtitle">
    Enter your SecureVault email address and we'll send you a verification code.
</p>

<!-- EMAIL SECTION -->
<div id="emailSection">

    <label for="email">Email address</label>

    <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
    >

    <button id="sendButton" onclick="sendCode()">
        Send Verification Code
    </button>

</div>

<!-- VERIFICATION SECTION -->
<div id="codeSection" class="hidden">

    <label for="code">Verification code</label>

    <input
        type="text"
        id="code"
        placeholder="Enter 6-digit code"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
    >

    <button id="verifyButton" onclick="verifyCode()">
        Verify Code
    </button>

</div>

<div id="message" class="message"></div>

<a href="index.html" class="back">
    ← Back to VaultSecure
</a>
```

</div>

<script>

    let currentEmail = "";


    function showMessage(text, type) {

        const message = document.getElementById("message");

        message.textContent = text;
        message.className = "message " + type;

    }


    async function sendCode() {

        const emailInput = document.getElementById("email");
        const sendButton = document.getElementById("sendButton");

        const email = emailInput.value.trim();

        if (!email) {

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;
        }

        sendButton.disabled = true;
        sendButton.textContent = "Sending...";

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/send-code",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );

            const data = await response.json();

            if (data.success) {

                currentEmail = email;

                document
                    .getElementById("emailSection")
                    .classList
                    .add("hidden");

                document
                    .getElementById("codeSection")
                    .classList
                    .remove("hidden");

                showMessage(
                    "Verification code sent! Check your inbox and also your Spam/Junk folder.",
                    "success"
                );

            } else {

                showMessage(
                    data.message ||
                    "Could not send the verification code.",
                    "error"
                );

            }

        } catch (error) {

            showMessage(
                "Could not connect to the SecureVault server. Make sure server.py is running.",
                "error"
            );

        } finally {

            sendButton.disabled = false;
            sendButton.textContent = "Send Verification Code";

        }
    }


    async function verifyCode() {

        const codeInput = document.getElementById("code");
        const verifyButton = document.getElementById("verifyButton");

        const code = codeInput.value.trim();

        if (!code) {

            showMessage(
                "Please enter the verification code.",
                "error"
            );

            return;
        }

        verifyButton.disabled = true;
        verifyButton.textContent = "Verifying...";

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/verify-code",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: currentEmail,
                        code: code
                    })
                }
            );

            const data = await response.json();

            if (data.success) {

                showMessage(
                    "Verification successful! You can now reset your password.",
                    "success"
                );

                document
                    .getElementById("codeSection")
                    .classList
                    .add("hidden");

            } else {

                showMessage(
                    data.message ||
                    "Invalid verification code.",
                    "error"
                );

            }

        } catch (error) {

            showMessage(
                "Could not connect to the SecureVault server.",
                "error"
            );

        } finally {

            verifyButton.disabled = false;
            verifyButton.textContent = "Verify Code";

        }
    }

</script>
