<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVault Recovery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, #172033 0%, #090c12 45%, #05070b 100%);
            color: white;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(16, 22, 32, 0.96);
            border: 1px solid #263246;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 15px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .step {
            color: #60a5fa;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            border: 1px solid #334155;
            background: #0b111a;
            color: white;
            border-radius: 10px;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            transition: 0.2s;
            margin-top: 3px;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .secondary {
            background: #1e293b;
            margin-top: 10px;
        }

        .secondary:hover {
            background: #273449;
        }

        .hidden {
            display: none !important;
        }

        .message {
            margin-top: 16px;
            border-radius: 10px;
            padding: 12px;
            line-height: 1.4;
            font-size: 14px;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #86efac;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .token-box {
            margin-top: 18px;
            padding: 16px;
            border-radius: 12px;
            background: #090e16;
            border: 1px solid #334155;
        }

        .token-label {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .token-row {
            display: flex;
            gap: 8px;
        }

        .token-row input {
            margin: 0;
            flex: 1;
            font-family: Consolas, monospace;
            font-size: 12px;
        }

        .copy-button {
            width: auto;
            min-width: 100px;
            margin: 0;
            padding: 10px 14px;
            background: #1d4ed8;
        }

        .warning {
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: #fcd34d;
            font-size: 13px;
            line-height: 1.45;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 12px;
        }

        .section {
            margin-top: 24px;
        }

        .code-input {
            text-align: center;
            letter-spacing: 8px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🔐</div>

    <h1>SecureVault Recovery</h1>

    <p class="subtitle">
        Verify your recovery email to receive a temporary reset token.
    </p>

    <!-- STEP 1 -->
    <div id="step1">

        <div class="step">Step 1</div>

        <label for="email">Recovery Email</label>

        <input
            id="email"
            type="email"
            placeholder="Enter your recovery email"
            autocomplete="email"
        >

        <button id="sendCodeButton" onclick="sendCode()">
            Send Verification Code
        </button>

    </div>

    <!-- STEP 2 -->
    <div id="step2" class="section hidden">

        <div class="step">Step 2</div>

        <label for="code">6-Digit Verification Code</label>

        <input
            id="code"
            class="code-input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
        >

        <button id="verifyButton" onclick="verifyCode()">
            Verify Code
        </button>

        <button class="secondary" onclick="sendCode()">
            Send New Code
        </button>

    </div>

    <!-- STEP 3 -->
    <div id="step3" class="section hidden">

        <div class="step">Step 3</div>

        <label>Reset Token</label>

        <div class="token-box">

            <div class="token-label">
                Copy this token into the SecureVault desktop app.
            </div>

            <div class="token-row">

                <input
                    id="resetToken"
                    type="text"
                    readonly
                >

                <button
                    id="copyButton"
                    class="copy-button"
                    onclick="copyToken()"
                >
                    Copy
                </button>

            </div>

            <div class="warning">
                This token is temporary. Keep it private and use it in
                the SecureVault app along with your Recovery Key.
            </div>

        </div>

    </div>

    <div id="message" class="message"></div>

    <div class="footer">
        SecureVault Recovery Server
    </div>

</div>


<script>

    /*
        Same-origin API.

        Because the webpage and Flask API are deployed together,
        these URLs work on:

        https://securevaultreal.vercel.app
    */

    let verificationChallenge = "";
    let verifiedResetToken = "";


    // ==========================================================
    // MESSAGE
    // ==========================================================

    function showMessage(text, type) {

        const message = document.getElementById("message");

        message.textContent = text;
        message.className = "message " + type;

    }


    function clearMessage() {

        const message = document.getElementById("message");

        message.textContent = "";
        message.className = "message";

    }


    // ==========================================================
    // SEND CODE
    // ==========================================================

    async function sendCode() {

        clearMessage();

        const email = document.getElementById("email").value.trim();
        const button = document.getElementById("sendCodeButton");

        if (!email) {

            showMessage(
                "Please enter your recovery email.",
                "error"
            );

            return;
        }


        button.disabled = true;
        button.textContent = "Sending...";


        try {

            const response = await fetch("/send-code", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email
                })

            });


            const data = await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error || "Could not send verification code."
                );

            }


            verificationChallenge = data.challenge;


            document.getElementById("step2")
                .classList.remove("hidden");


            document.getElementById("code").focus();


            showMessage(
                "Verification code sent to your recovery email.",
                "success"
            );

        }
        catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }
        finally {

            button.disabled = false;
            button.textContent = "Send Verification Code";

        }

    }


    // ==========================================================
    // VERIFY CODE
    // ==========================================================

    async function verifyCode() {

        clearMessage();

        const email = document.getElementById("email").value.trim();
        const code = document.getElementById("code").value.trim();

        const button = document.getElementById("verifyButton");


        if (!email) {

            showMessage(
                "Please enter your recovery email.",
                "error"
            );

            return;
        }


        if (!/^\d{6}$/.test(code)) {

            showMessage(
                "Enter the 6-digit verification code.",
                "error"
            );

            return;
        }


        if (!verificationChallenge) {

            showMessage(
                "Please request a new verification code first.",
                "error"
            );

            return;
        }


        button.disabled = true;
        button.textContent = "Verifying...";


        try {

            const response = await fetch("/verify-code", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    code: code,

                    challenge: verificationChallenge

                })

            });


            const data = await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error || "Verification failed."
                );

            }


            // ==============================================
            // THIS IS THE IMPORTANT PART
            // ==============================================

            verifiedResetToken = data.reset_token;


            document.getElementById("resetToken").value =
                verifiedResetToken;


            document.getElementById("step3")
                .classList.remove("hidden");


            showMessage(
                "Email verified! Your Reset Token is ready to copy.",
                "success"
            );


            document.getElementById("resetToken").focus();


        }
        catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }
        finally {

            button.disabled = false;
            button.textContent = "Verify Code";

        }

    }


    // ==========================================================
    // COPY TOKEN
    // ==========================================================

    async function copyToken() {

        const tokenInput = document.getElementById("resetToken");
        const button = document.getElementById("copyButton");

        const token = tokenInput.value;

        if (!token) {

            showMessage(
                "There is no Reset Token to copy.",
                "error"
            );

            return;
        }


        try {

            await navigator.clipboard.writeText(token);

            button.textContent = "Copied ✓";


            setTimeout(() => {

                button.textContent = "Copy";

            }, 1500);


            showMessage(
                "Reset Token copied to your clipboard.",
                "success"
            );

        }
        catch (error) {

            // Fallback for browsers that block navigator.clipboard

            tokenInput.focus();
            tokenInput.select();

            document.execCommand("copy");

            button.textContent = "Copied ✓";


            setTimeout(() => {

                button.textContent = "Copy";

            }, 1500);


            showMessage(
                "Reset Token copied to your clipboard.",
                "success"
            );

        }

    }


    // ==========================================================
    // ONLY ALLOW NUMBERS IN CODE FIELD
    // ==========================================================

    document.getElementById("code").addEventListener(
        "input",
        function () {

            this.value = this.value.replace(/\D/g, "");

        }
    );


</script>

</body>
</html>
