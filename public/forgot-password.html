<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureVault — Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #172a46 0%,
                    #0b1020 45%,
                    #060a12 100%
                );
            color: white;
        }

        .card {
            width: 100%;
            max-width: 470px;
            margin: 20px;
            padding: 38px;
            border-radius: 22px;

            background: rgba(17, 26, 46, 0.96);

            border: 1px solid rgba(
                97,
                218,
                251,
                0.18
            );

            box-shadow:
                0 25px 70px rgba(
                    0,
                    0,
                    0,
                    0.5
                );
        }

        .icon {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 30px;
            color: #61dafb;
        }

        .subtitle {
            text-align: center;
            color: #aeb8ca;
            line-height: 1.5;
            margin: 10px 0 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;

            border-radius: 10px;
            border: 1px solid #33435f;

            background: #18243a;
            color: white;

            font-size: 15px;
            outline: none;

            margin-bottom: 15px;
        }

        input:focus {
            border-color: #61dafb;

            box-shadow:
                0 0 0 2px rgba(
                    97,
                    218,
                    251,
                    0.08
                );
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #61dafb;
            color: #07111d;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .secondary {
            margin-top: 12px;
            background: #25334d;
            color: white;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;

            border-radius: 10px;

            font-size: 14px;
            line-height: 1.45;
        }

        .message.success {
            display: block;

            background: rgba(
                40,
                167,
                69,
                0.12
            );

            border: 1px solid rgba(
                40,
                167,
                69,
                0.35
            );

            color: #b9f6c5;
        }

        .message.error {
            display: block;

            background: rgba(
                220,
                53,
                69,
                0.12
            );

            border: 1px solid rgba(
                220,
                53,
                69,
                0.35
            );

            color: #ffb8bf;
        }

        .hidden {
            display: none;
        }

        .small {
            margin-top: 20px;
            text-align: center;

            color: #68748a;
            font-size: 12px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 18px;

            text-align: center;

            color: #61dafb;
            text-decoration: none;

            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            🔑
        </div>

        <h1>
            Forgot Password
        </h1>

        <div class="subtitle">
            Verify your email to continue with
            SecureVault account recovery.
        </div>


        <!-- ================================= -->
        <!-- EMAIL STEP -->
        <!-- ================================= -->

        <div id="emailStep">

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
            >

            <button
                id="sendButton"
                onclick="sendCode()"
            >
                Send Verification Code
            </button>

        </div>


        <!-- ================================= -->
        <!-- CODE STEP -->
        <!-- ================================= -->

        <div
            id="codeStep"
            class="hidden"
        >

            <label for="code">
                Verification Code
            </label>

            <input
                id="code"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter 6-digit code"
                autocomplete="one-time-code"
            >

            <button
                id="verifyButton"
                onclick="verifyCode()"
            >
                Verify Code
            </button>

            <button
                id="changeEmailButton"
                class="secondary"
                onclick="goBack()"
            >
                ← Change Email
            </button>

        </div>


        <!-- ================================= -->
        <!-- MESSAGE -->
        <!-- ================================= -->

        <div
            id="message"
            class="message"
        ></div>


        <div class="small">
            Verification codes expire after 10 minutes.
            Never share your verification code with anyone.
        </div>

        <a
            class="back-link"
            href="/"
        >
            ← Back to VaultSecure
        </a>

    </div>


    <script>

        let savedEmail = "";
        let challenge = "";


        // =================================
        // SHOW MESSAGE
        // =================================

        function showMessage(
            text,
            success
        ) {
            const message =
                document.getElementById(
                    "message"
                );

            message.textContent = text;

            if (success) {
                message.className =
                    "message success";
            } else {
                message.className =
                    "message error";
            }
        }


        // =================================
        // CLEAR MESSAGE
        // =================================

        function clearMessage() {
            const message =
                document.getElementById(
                    "message"
                );

            message.textContent = "";
            message.className =
                "message";
        }


        // =================================
        // SEND CODE
        // =================================

        async function sendCode() {

            clearMessage();

            const emailInput =
                document.getElementById(
                    "email"
                );

            const button =
                document.getElementById(
                    "sendButton"
                );

            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            if (!email) {

                showMessage(
                    "Please enter your email address.",
                    false
                );

                emailInput.focus();

                return;
            }


            if (
                !email.includes("@") ||
                !email.includes(".")
            ) {

                showMessage(
                    "Please enter a valid email address.",
                    false
                );

                emailInput.focus();

                return;
            }


            button.disabled = true;
            button.textContent =
                "Sending...";


            try {

                const response =
                    await fetch(
                        "/send-code",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })
                        }
                    );


                let result;

                try {
                    result =
                        await response.json();
                } catch {
                    result = {
                        success: false,
                        message:
                            "The server returned an invalid response."
                    };
                }


                if (
                    !response.ok ||
                    !result.success
                ) {

                    showMessage(
                        result.message ||
                        "Could not send verification code.",
                        false
                    );

                    button.disabled = false;
                    button.textContent =
                        "Send Verification Code";

                    return;
                }


                savedEmail = email;

                challenge =
                    result.challenge || "";


                if (!challenge) {

                    showMessage(
                        "The server did not provide a verification challenge.",
                        false
                    );

                    button.disabled = false;
                    button.textContent =
                        "Send Verification Code";

                    return;
                }


                document
                    .getElementById(
                        "emailStep"
                    )
                    .classList
                    .add("hidden");


                document
                    .getElementById(
                        "codeStep"
                    )
                    .classList
                    .remove("hidden");


                showMessage(
                    "Verification code sent. Check your inbox and Spam/Junk folder.",
                    true
                );


                document
                    .getElementById(
                        "code"
                    )
                    .focus();

            } catch (error) {

                console.error(
                    "Send code error:",
                    error
                );

                showMessage(
                    "Could not connect to the SecureVault server.",
                    false
                );

                button.disabled = false;

                button.textContent =
                    "Send Verification Code";
            }
        }


        // =================================
        // VERIFY CODE
        // =================================

        async function verifyCode() {

            clearMessage();

            const codeInput =
                document.getElementById(
                    "code"
                );

            const button =
                document.getElementById(
                    "verifyButton"
                );

            const code =
                codeInput.value.trim();


            if (
                code.length !== 6 ||
                !/^\d{6}$/.test(code)
            ) {

                showMessage(
                    "Enter the 6-digit verification code.",
                    false
                );

                codeInput.focus();

                return;
            }


            if (!savedEmail) {

                showMessage(
                    "Your email session has expired. Please request a new code.",
                    false
                );

                return;
            }


            if (!challenge) {

                showMessage(
                    "Your verification session is invalid. Please request a new code.",
                    false
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "Verifying...";


            try {

                const response =
                    await fetch(
                        "/verify-code",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email:
                                    savedEmail,

                                code:
                                    code,

                                challenge:
                                    challenge

                            })
                        }
                    );


                let result;

                try {
                    result =
                        await response.json();
                } catch {
                    result = {
                        success: false,
                        message:
                            "The server returned an invalid response."
                    };
                }


                if (
                    !response.ok ||
                    !result.success
                ) {

                    showMessage(
                        result.message ||
                        "Verification failed.",
                        false
                    );

                    button.disabled = false;

                    button.textContent =
                        "Verify Code";

                    return;
                }


                showMessage(
                    "Email verified successfully.",
                    true
                );


                button.disabled = true;

                button.textContent =
                    "Verified ✓";

            } catch (error) {

                console.error(
                    "Verify code error:",
                    error
                );

                showMessage(
                    "Could not connect to the SecureVault server.",
                    false
                );

                button.disabled = false;

                button.textContent =
                    "Verify Code";
            }
        }


        // =================================
        // CHANGE EMAIL
        // =================================

        function goBack() {

            clearMessage();

            savedEmail = "";
            challenge = "";


            document.getElementById(
                "code"
            ).value = "";


            document
                .getElementById(
                    "codeStep"
                )
                .classList
                .add("hidden");


            document
                .getElementById(
                    "emailStep"
                )
                .classList
                .remove("hidden");


            const sendButton =
                document.getElementById(
                    "sendButton"
                );

            sendButton.disabled = false;

            sendButton.textContent =
                "Send Verification Code";
        }


        // =================================
        // ONLY ALLOW NUMBERS IN CODE
        // =================================

        document
            .getElementById(
                "code"
            )
            .addEventListener(
                "input",
                function () {

                    this.value =
                        this.value.replace(
                            /\D/g,
                            ""
                        );
                }
            );


        // =================================
        // ENTER KEY SUPPORT
        // =================================

        document
            .getElementById(
                "email"
            )
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {
                        sendCode();
                    }

                }
            );


        document
            .getElementById(
                "code"
            )
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {
                        verifyCode();
                    }

                }
            );

    </script>

</body>
</html>
